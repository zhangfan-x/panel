[project]
name = "mypanel"
version = "0.1.0"
description = "Self-hosted single-admin server management panel for Debian/Ubuntu"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "sqlalchemy[asyncio]>=2.0.30",
    "aiosqlite>=0.20",
    "alembic>=1.13",
    "psutil>=6.0",
    "structlog>=24.1",
    "pwdlib[argon2]>=0.2",
    "python-multipart>=0.0.9",
    "docker>=7.1",
    "pyyaml>=6.0",
    "httpx>=0.27",
    "quickjs>=1.19",
]

[project.scripts]
mypanel = "mypanel.cli:main"
mypanel-helper = "mypanel.helper.main:main"
mypanel-terminal = "mypanel.terminal.service_main:main"
mypanelctl = "mypanel.ctl.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "httpx>=0.27",
    "ruff>=0.5",
    "mypy>=1.10",
    "pip-audit>=2.7",
    "types-psutil",
    "types-pyyaml>=6.0.12.20260518",
    "websockets>=13",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mypanel"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
ignore = ["SIM108"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true
mypy_path = "src"
packages = ["mypanel"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
